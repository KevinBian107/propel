[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "propel"
version = "0.1.0"
description = "Research workflow CLI for Claude Code — skills, agents, and session management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kevin Bian"}
]
dependencies = [
    "click>=8.0",
]

[project.scripts]
propel = "propel_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propel_cli = ["launcher.html"]
